[build]
  command = "npm test"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/internal/deliver"
  function = "dispatch-auth"

[[edge_functions]]
  path = "/.netlify/functions/*"
  function = "reject-direct"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
